[project]
name = "ur"
version = "0.1.0"
description = "Hill-climb a model with fresh agent sessions against a sealed benchmark."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ur = "ur.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ur"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
